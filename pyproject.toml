[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ComfyUI-Z-Image-i2L-Node"
version = "0.1.0"
description = "ComfyUI custom nodes for Z-Image i2L (Image-to-LoRA)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["comfyui", "z-image", "lora", "image-to-lora", "diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "Pillow>=9.0.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "diffsynth>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/mxli-1999/ComfyUI-Z-Image-i2L-Node"
Issues   = "https://github.com/mxli-1999/ComfyUI-Z-Image-i2L-Node/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ComfyUI_Z_Image_i2L_Node*"]
